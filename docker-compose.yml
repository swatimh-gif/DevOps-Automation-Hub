version: '3.8'

services:
  devops-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-automation-hub:latest
    container_name: devops_hub_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - DEVOPS_STAGE=production
      - DEPLOYMENT_TARGET=Docker-Local
    volumes:
      - devops_data:/app/instance
      - devops_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  devops_data:
    driver: local
  devops_logs:
    driver: local
