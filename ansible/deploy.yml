---
- name: Deploy DevOps Automation Hub using Docker
  hosts: local
  gather_facts: false

  tasks:
    - name: Build application Docker image
      ansible.builtin.command:
        cmd: docker build -t devops-automation-hub:latest .
        chdir: "{{ playbook_dir }}/.."

    - name: Remove previous application container
      ansible.builtin.command:
        cmd: docker rm -f devops-hub
      register: remove_result
      failed_when: false
      changed_when: remove_result.rc == 0

    - name: Run application container
      ansible.builtin.command:
        cmd: docker run -d --name devops-hub -p 5000:5000 devops-automation-hub:latest
