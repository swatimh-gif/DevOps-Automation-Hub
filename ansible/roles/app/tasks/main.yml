---
- name: Install Python runtime packages
  ansible.builtin.apt:
    name: "{{ system_packages }}"
    state: present
    update_cache: true
  become: true

- name: Build source archive from committed code (on the control machine)
  ansible.builtin.command: git archive --format=zip -o {{ src_archive }} HEAD
  args:
    chdir: "{{ playbook_dir }}/.."
  delegate_to: localhost
  run_once: true
  changed_when: true

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0755"

- name: Unpack application code
  ansible.builtin.unarchive:
    src: "{{ src_archive }}"
    dest: "{{ app_dir }}"
  notify: Restart app

- name: Create virtualenv and install requirements
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_dir }}/.venv"
    virtualenv_command: python3 -m venv
  notify: Restart app

- name: Render environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_dir }}/app.env"
    mode: "0644"
  notify: Restart app

- name: Render start script
  ansible.builtin.template:
    src: start.sh.j2
    dest: "{{ app_dir }}/start.sh"
    mode: "0755"
  notify: Restart app

- name: Apply pending restarts now
  ansible.builtin.meta: flush_handlers

- name: Wait until the app listens on its port
  ansible.builtin.wait_for:
    port: "{{ app_port | int }}"
    host: 127.0.0.1
    timeout: 30