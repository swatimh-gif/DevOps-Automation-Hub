name: DevOps Automation Hub CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Enable manual triggers from GitHub UI

jobs:
  build-and-test:
    name: Build, Test & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Source
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-cov

      - name: 🔍 Lint Code with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🧪 Execute Automated Tests with Pytest
        run: |
          pytest tests/ -v --durations=10

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: devops-automation-hub:latest

      - name: 🩺 Container Health Check Smoke Test
        run: |
          # Spin up container to verify healthy runtime
          docker run -d --name devops-smoke-test -p 5000:5000 devops-automation-hub:latest
          sleep 5
          docker ps
          curl -f http://localhost:5000/health || exit 1
          docker stop devops-smoke-test

      - name: 📢 Report Workflow Status
        if: always()
        run: |
          echo "Pipeline Run Finished with status: ${{ job.status }}"
